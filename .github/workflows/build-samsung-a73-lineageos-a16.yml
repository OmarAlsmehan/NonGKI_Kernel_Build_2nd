name: Build Galaxy A73 (5G) (LineageOS 23.2 A16)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "SamsungGalaxyA73 5G"
  DEVICE_CODENAME : "a73xq"

  CUSTOM_CMDS : "ARCH=arm64"
  EXTRA_CMDS : "LLVM=1 LLVM_IAS=1 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi-"

  KERNEL_SOURCE : "https://github.com/OmarAlsmehan/android_kernel_samsung_sm7325.git"
  KERNEL_BRANCH : "clo2"

  CLANG_SOURCE : "https://github.com/bachnxuan/aosp_clang_mirror/releases/download/clang-r563880c-13989888/clang-r563880c.tar.gz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : ""
  GCC_64_BRANCH : ""
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/lineage-a73xq_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh"
  KERNELSU_BRANCH : "legacy"

  KERNELSU_AUTO_GET : "false" # if u want easy setting kernelsu, u can true.
  KERNELSU_AUTO_FORK : "rsuntk" # magic, rsuntk, next, resukisu and sukisu

  SUSFS_ENABLE : false
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "lineageos_23.2"

  # Other env
  PYTHON_VERSION: "3" # Only 2(Ubuntu 22.04 and Ubuntu 20.04) or 3(Any OS Versions).

  PACK_METHOD: "Anykernel3" # Anykernel3 need SOURCE and BRANCH, MKBOOTIMG needn't it.

  KERNELSU_METHOD: "shell" # shell, manual and only.

  PATCHES_SOURCE: "cyberc3dr/NonGKI_Kernel_Patches" # [your_name]/[your_patch] -> gooder123/NonGKI_Patcher
  PATCHES_BRANCH: "nothing_kernel" # [your_branch] -> main

  SUSFS_FOLDER_FIXED: "np1" # Fill in your patch prefix directory here. Leave it blank if there isn't one. -> your_folder
  SUSFS_PATCH_FIXED: "pershoot-susfs" # Fill in your patches here. If there are multiple patches, please separate them with a comma. Leave it blank if there isn't one. -> patch1,patch2

  REKERNEL_ENABLE: "false" # if u need Re:Kernel.

  HOOK_METHOD: "syscall" # Manual hook method -> syscall.
  HOOK_OLDER: "false" # contain backport older patch and syscall older patch.

  KERNEL_PATCH: "false" # If your kernel version is <= 4.9, you have the option of enabling the patch to patch the kernel_write and kernel_read functions.

  KPM_ENABLE: "false" # Anyone devices.
  KPM_INLINE: "false" # Only use it for SukiSU-Ultra.
  KPM_KPATCH_NEXT: "false" # If u want hook KPatch-Next in build step.
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" # If u want to use KPM Inline,so you need set patch exec file source -> raw.githubusercontent.com/Test/Test/patch .

  BASEBAND_GUARD_ENABLE: "false" #if u want prevent unauthorized writes to critical partitions/device nodes.
  BASEBAND_GUARD_BOOT: "false" #if u want to protect boot partition.

  HIDE_STUFF: "true" # hide some of the features

  GENERATE_DTB: "false" # if u kernel need DTB , but cannot auto generate it. (Only Anykernel3).
  GENERATE_CHIP: "qcom" # only supported for qcom and mediatek.

  BUILD_DEBUGGER: "false" # Output build errors.
  SKIP_PATCH: "false" # Ignore errors found in Patch Debugger.

  BUILD_OTHER_CONFIG: "false" # Merge config files.
  MERGE_CONFIG_FILES: "vendor/debugfs.config,vendor/lahaina_QGKI.config"

  FREE_MORE_SPACE: "false" # if u want get more space, enabled it.

  # Vendor Boot Repack
  VENDOR_BOOT_REPACK_ENABLE: "true"
  VENDOR_BOOT_SOURCE: "https://github.com/OmarAlsmehan/proprietary_vendor_samsung_a73xq/releases/download/Vendor_boot.img/vendor_boot.img.lz4"
  VENDOR_BOOT_SOC: "qcom"             # SM7325 = Snapdragon 778G (reserved for future logic).
  VENDOR_BOOT_DTB_REPLACE: "true"     # Replace DTB inside vendor_boot with compiled one.
  VENDOR_BOOT_FSTAB_MULTIFS: "true"   # Rewrite fstab to accept erofs + ext4 + f2fs.
  VENDOR_BOOT_MODULES_INJECT: "true"  # Inject compiled .ko into lib/modules.
  VENDOR_BOOT_FIRMWARE_ENABLE: "true" # Inject firmware from Firmwares/a73xq/ in repo root.

jobs:
  build-kernel:
    name: Galaxy A73 5G (LineageOS 23.2 A16)
    runs-on: ubuntu-latest 
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        shell: bash
        run: |
           cd $GITHUB_WORKSPACE/device_kernel
           echo -e "\033[1;37mKernel Version: $(make -s kernelversion)\033[0m"

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 📦 Repack vendor_boot.img
        uses: ./.github/workflows/repack-vendor-boot

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
